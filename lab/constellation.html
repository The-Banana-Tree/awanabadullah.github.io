<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation · Projects Lab</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/shooting-stars.css">
<link rel="stylesheet" href="lab.css">
<style>
/* ==================================================
   PROTOTYPE 1 — CONSTELLATION
   The starfield already behind the site resolves into
   a shape; the background becomes the content.
   ================================================== */
.const-layout {
    display: grid;
    grid-template-columns: 1fr clamp(280px, 28vw, 380px);
    gap: 18px;
    align-items: stretch;
    min-height: 62vh;
}
#field {
    position: relative;
    border: 2px solid var(--border);
    overflow: hidden;
    min-height: 420px;
    cursor: crosshair;
}
#fieldSvg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* faint background stars, drawn once */
.bg-star { fill: var(--text); }

/* the lines joining the projects */
.link {
    stroke: var(--text);
    stroke-width: 1;
    opacity: 0.16;
    transition: opacity 0.3s, stroke-width 0.3s;
}
.link.hot { opacity: 0.75; stroke-width: 1.6; stroke: var(--accent); }

/* a project star */
.node { cursor: pointer; }
/* The default focus ring draws a box around the whole group, label included,
   which looks like a stray rectangle on the star field. */
.node:focus { outline: none; }
.node:focus-visible .node-core { stroke: var(--accent); stroke-width: 2; }
.node-halo {
    fill: var(--accent);
    opacity: 0;
    transition: opacity 0.3s, r 0.3s;
}
.node-core {
    fill: var(--text);
    transition: fill 0.25s, r 0.25s;
}
.node:hover .node-halo, .node.on .node-halo { opacity: 0.18; }
.node:hover .node-core, .node.on .node-core { fill: var(--accent); }
.node.on .node-halo { opacity: 0.3; }

.node-label {
    fill: var(--text);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.55;
    transition: opacity 0.25s, fill 0.25s;
    pointer-events: none;
}
.node:hover .node-label, .node.on .node-label { opacity: 1; fill: var(--accent); }

/* soft pulse so the stars read as alive, not as dots on a map */
@keyframes nodePulse { 0%,100% { r: 5; } 50% { r: 6.5; } }
.node-core { animation: nodePulse var(--pulse) ease-in-out infinite; }

.field-hint {
    position: absolute;
    left: 14px; bottom: 12px;
    font-size: 0.68rem;
    letter-spacing: 1.5px;
    opacity: 0.35;
    pointer-events: none;
}

@media (max-width: 820px) {
    .const-layout { grid-template-columns: 1fr; }
    #field { min-height: 340px; }
    .node-label { font-size: 9px; }
}
@media (prefers-reduced-motion: reduce) {
    .node-core { animation: none; }
}
</style>
</head>
<body>
<div id="shootingStarsOverlay"></div>

<nav class="lab-bar">
    <span class="lab-tag">Projects Lab</span>
    <a href="constellation.html" aria-current="page">1 · Constellation</a>
    <a href="orbit.html">2 · Orbit</a>
    <a href="signal.html">3 · Signal</a>
</nav>

<div class="lab-wrap">
    <header class="lab-head">
        <h1>Constellation</h1>
        <p>The starfield behind the site resolves into a shape. Each project is a star; hover to flare it and light its links, click to open the record.</p>
    </header>

    <div class="const-layout">
        <div id="field">
            <svg id="fieldSvg" aria-label="Project constellation"></svg>
            <span class="field-hint">hover a star · click to open</span>
        </div>
        <aside class="detail empty" id="detail">
            <p class="d-hint">Pick a star to open its record.</p>
        </aside>
    </div>
</div>

<script src="stars.js"></script>
<script type="module" src="constellation.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit · Projects Lab</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/shooting-stars.css">
<link rel="stylesheet" href="lab.css">
<style>
/* ==================================================
   PROTOTYPE 2 — ORBIT
   Built with the same CSS 3D technique as the site's
   existing torus, so it is literally the same object
   doing a new job.
   ================================================== */
.orbit-layout {
    display: grid;
    grid-template-columns: 1fr clamp(280px, 28vw, 380px);
    gap: 18px;
    min-height: 62vh;
}
#orbitBox {
    position: relative;
    border: 2px solid var(--border);
    min-height: 460px;
    overflow: hidden;
    perspective: 1100px;
}

/* the rings, same construction as .neural-spinner */
.orbit-rings {
    position: absolute;
    top: 50%; left: 50%;
    width: 340px; height: 340px;
    margin: -170px 0 0 -170px;
    transform-style: preserve-3d;
    transform: rotateX(68deg);
    pointer-events: none;
}
.orbit-ring {
    position: absolute;
    inset: 0;
    border: 1px solid var(--text);
    border-radius: 50%;
    opacity: 0.18;
}
.orbit-ring:nth-child(2) { inset: 40px; border-color: var(--accent); opacity: 0.14; }
.orbit-ring:nth-child(3) { inset: 80px; opacity: 0.1; }

/* the core the projects orbit */
.orbit-core {
    position: absolute;
    top: 50%; left: 50%;
    width: 54px; height: 54px;
    margin: -27px 0 0 -27px;
    border: 2px solid var(--accent);
    transform: rotate(45deg);
    opacity: 0.5;
    pointer-events: none;
}
.orbit-core::after {
    content: "";
    position: absolute;
    inset: 12px;
    border: 1px solid var(--text);
    opacity: 0.6;
}

/* the carousel of project nodes */
.orbit-track {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    transform-style: preserve-3d;
}
.orbit-node {
    position: absolute;
    width: 190px;
    margin-left: -95px;
    transform-style: preserve-3d;
    will-change: transform, opacity;
}
.orbit-node button {
    width: 100%;
    padding: 12px 10px;
    font-family: var(--font);
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    line-height: 1.4;
    color: var(--text);
    background: var(--bg);
    border: 2px solid var(--border);
    cursor: pointer;
    transition: color 0.3s, border-color 0.3s, box-shadow 0.3s, background 0.3s;
}
/* Depth sets node opacity inline, so hover lifts the button itself. */
.orbit-node button:hover { border-color: var(--accent); color: var(--accent); }
.orbit-node.front button {
    opacity: 1;
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 6px 0 rgba(0,0,0,0.6);
}
.orbit-dot {
    position: absolute;
    top: -18px; left: 50%;
    width: 7px; height: 7px;
    margin-left: -3.5px;
    border-radius: 50%;
    background: var(--text);
    opacity: 0.5;
}
.orbit-node.front .orbit-dot { background: var(--accent); opacity: 1; }

.orbit-ctrl {
    position: absolute;
    bottom: 14px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 5;
}
.orbit-ctrl button {
    width: 40px; height: 34px;
    font-family: var(--font);
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--accent);
    cursor: pointer;
}
.orbit-ctrl button:hover { background: var(--accent); color: var(--bg); }

.orbit-hint {
    position: absolute;
    left: 14px; bottom: 16px;
    font-size: 0.68rem;
    letter-spacing: 1.5px;
    opacity: 0.35;
    pointer-events: none;
}

@media (max-width: 820px) {
    .orbit-layout { grid-template-columns: 1fr; }
    #orbitBox { min-height: 380px; }
    .orbit-rings { width: 250px; height: 250px; margin: -125px 0 0 -125px; }
    .orbit-node { width: 140px; margin-left: -70px; }
    .orbit-node button { font-size: 0.62rem; padding: 9px 6px; }
}

</style>
</head>
<body>
<div id="shootingStarsOverlay"></div>

<nav class="lab-bar">
    <span class="lab-tag">Projects Lab</span>
    <a href="constellation.html">1 · Constellation</a>
    <a href="orbit.html" aria-current="page">2 · Orbit</a>
    <a href="signal.html">3 · Signal</a>
</nav>

<div class="lab-wrap">
    <header class="lab-head">
        <h1>Orbit</h1>
        <p>The wireframe torus already in your hero becomes the navigation. Projects ride a ring around a core; click one and it swings to the front.</p>
    </header>

    <div class="orbit-layout">
        <div id="orbitBox">
            <div class="orbit-rings">
                <div class="orbit-ring"></div>
                <div class="orbit-ring"></div>
                <div class="orbit-ring"></div>
            </div>
            <div class="orbit-core"></div>
            <div class="orbit-track" id="track"></div>
            <div class="orbit-ctrl">
                <button id="prev" type="button" aria-label="Previous">&#9664;</button>
                <button id="next" type="button" aria-label="Next">&#9654;</button>
            </div>
            <span class="orbit-hint">click a node · &#9664; &#9654; to rotate</span>
        </div>
        <aside class="detail" id="detail"></aside>
    </div>
</div>

<script src="stars.js"></script>
<script type="module" src="orbit.js"></script>
</body>
</html>

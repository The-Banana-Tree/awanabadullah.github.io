<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit · Projects Lab</title>
<link rel="stylesheet" href="../assets/css/style.css?v=1">
<link rel="stylesheet" href="../assets/css/shooting-stars.css?v=1">
<link rel="stylesheet" href="lab.css?v=2">
<style>
/* ==================================================
   PROTOTYPE 2 — ORBIT
   Built with the same CSS 3D technique as the site's
   existing torus, so it is literally the same object
   doing a new job.
   ================================================== */
/* Capped and centred rather than spread across the full 1400px wrap. The ring
   is only ever 500px across, so a full-width column left a lake of empty space
   between the model and the text that was meant to describe it. */
.orbit-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(280px, 30vw, 360px);
    gap: 14px;
    max-width: 1020px;
    margin: 0 auto;
    align-items: stretch;
}
/* No `perspective` here on purpose. With it, a node's distance from the centre
   was multiplied by 1100/(1100-z), which both threw the front node out past the
   bottom edge and stopped the nodes sitting on the ring - a rotated circle and a
   hand-placed ellipse put the same point at different z. Flat projection makes
   the two exact, and depth still reads from the scale and fade in place(). */
/* Taller than it used to be. The model takes a fixed share of the box's short
   side, and on a desktop that short side is the height - so box height is the
   one number that decides how big the hero reads. The ring does not grow with
   it: its lean caps the vertical radius, so the extra space goes to the model
   rather than spreading the nodes out. */
#orbitBox {
    position: relative;
    border: 2px solid var(--border);
    height: 470px;
    overflow: hidden;
    background: var(--bg);
    z-index: 2;
}

/* The starfield is a fixed, full-page overlay at z-index 999999, so stars were
   streaking straight through the model and across the panel's text. Dropping it
   under these two panels keeps it everywhere else on the page - it is the
   site's language - while the model gets clean black to sit on. Scoped here, so
   the other prototypes keep their stars edge to edge. */
#shootingStarsOverlay { z-index: 1; }

/* Same square the site's own mute button uses, at bar height. */
.sfx-toggle {
    width: 34px; height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    line-height: 1;
    background: var(--accent);
    color: var(--bg);
    border: 2px solid var(--border);
    cursor: pointer;
}
.sfx-toggle:hover { filter: brightness(1.15); }
.detail {
    position: relative;
    z-index: 2;
    background: var(--bg);
}

/* The rings, same construction as .neural-spinner. Diameter and tilt come from
   JS so the outer ring is the exact ellipse the nodes travel on - they ride the
   ring instead of floating near it. */
.orbit-rings {
    position: absolute;
    top: 50%; left: 50%;
    width: var(--ringD, 420px); height: var(--ringD, 420px);
    margin-top: calc(var(--ringD, 420px) / -2);
    margin-left: calc(var(--ringD, 420px) / -2);
    transform-style: preserve-3d;
    transform: rotateX(var(--ringRot, 68deg));
    pointer-events: none;
}
.orbit-ring {
    position: absolute;
    inset: 0;
    border: 1px solid var(--text);
    border-radius: 50%;
    opacity: 0.18;
}
.orbit-ring:nth-child(2) { inset: 12%; border-color: var(--accent); opacity: 0.14; }
.orbit-ring:nth-child(3) { inset: 24%; opacity: 0.1; }

/* ---- the core the projects orbit ----
   The selected project's model *is* the core. No panel, no frame: the model
   floats at the centre of the ring, so the ring reads as orbiting it. Sizes
   come from JS as --stage/--lift so they track the box. */
/* Ring lines and model geometry are both thin bright strokes, so where they
   crossed they read as one tangle. This quiets the ring through the middle,
   and now that the model runs large it does the same job for the far half of
   the carousel: it sits above the far nodes (z-index 2-42) and below the model
   (50), so a label behind the hero fades into the background the way it would
   if it were genuinely behind something. The near nodes (60-100) clear it. */
.orbit-veil {
    position: absolute;
    top: 50%; left: 50%;
    width: calc(var(--stage, 200px) * 1.3);
    height: calc(var(--stage, 200px) * 1.3);
    transform: translate(-50%, -50%);
    z-index: 45;
    pointer-events: none;
    background: radial-gradient(closest-side, var(--bg) 0%, var(--bg) 42%, transparent 100%);
}

.orbit-stage {
    position: absolute;
    top: 50%; left: 50%;
    width: var(--stage, 240px);
    height: var(--stage, 240px);
    transform: translate3d(-50%, -50%, 0);
    z-index: 50;
    pointer-events: none;
}
.orbit-stage canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    display: block;
}

/* the diamond that used to be the core, kept as a registration mark behind
   the model so the centre still holds when a model is booting in */
.orbit-core {
    position: absolute;
    top: 50%; left: 50%;
    width: 22%; height: 22%;
    border: 2px solid var(--accent);
    transform: translate(-50%, -50%) rotate(45deg);
    opacity: 0.16;
}
.orbit-core::after {
    content: "";
    position: absolute;
    inset: 22%;
    border: 1px solid var(--text);
    opacity: 0.6;
}

/* ---- the build-log sticker ----
   Slapped on the model rather than parked in the panel: a project still being
   built has something to read, and the model is what people look at. Sits
   above every node so it is always clickable, but under the arrows. Placed off
   --stage so it stays on the model's shoulder at any box size.

   The starburst is cut in CSS rather than dropped in as an image: it follows
   the theme's colours, stays sharp at any size, and costs no request. The
   outer element is the rim, the inner span is the face, same 16-spike cut at
   slightly different scales - a border would be sliced off by the clip. */
.orbit-sticker {
    --burst: polygon(50.0% 0.0%, 58.1% 9.3%, 69.1% 3.8%, 73.1% 15.5%, 85.4% 14.6%, 84.5% 26.9%,
        96.2% 30.9%, 90.7% 41.9%, 100.0% 50.0%, 90.7% 58.1%, 96.2% 69.1%, 84.5% 73.1%,
        85.4% 85.4%, 73.1% 84.5%, 69.1% 96.2%, 58.1% 90.7%, 50.0% 100.0%, 41.9% 90.7%,
        30.9% 96.2%, 26.9% 84.5%, 14.6% 85.4%, 15.5% 73.1%, 3.8% 69.1%, 9.3% 58.1%,
        0.0% 50.0%, 9.3% 41.9%, 3.8% 30.9%, 15.5% 26.9%, 14.6% 14.6%, 26.9% 15.5%,
        30.9% 3.8%, 41.9% 9.3%);
    /* Yellow is the one loud colour neither theme has claimed - dark runs
       cyan on green, light runs magenta - so the sticker reads as an object
       stuck onto the page instead of more page furniture, and it keeps its
       hue when the theme flips. Rim is a dark gold: black would vanish into
       the dark background, and the face needs something to sit in. */
    --sticker-face: #ffe000;
    --sticker-rim: #c98a00;
    position: absolute;
    top: calc(50% - var(--stage, 240px) * 0.27);
    left: calc(50% + var(--stage, 240px) * 0.05);
    z-index: 150;
    width: 94px; height: 94px;
    display: flex;
    align-items: center;
    justify-content: center;
    clip-path: var(--burst);
    background: var(--sticker-rim);
    color: #1a1200;
    font-size: 0.58rem;
    line-height: 1.3;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-align: center;
    text-decoration: none;
    /* box-shadow would be clipped away with the corners; drop-shadow follows
       the cut shape instead, spikes and all. */
    filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.55));
    /* rotate and translate as their own properties rather than one transform:
       the idle rock owns those two, which leaves `scale` free for :hover. Under
       a transform shorthand the running animation would win and the hover would
       never show. */
    rotate: -13deg;
    transition: scale 0.2s, filter 0.2s;
    animation: stickOn 0.45s ease-out backwards,
               stickerRock 4.2s 0.45s ease-in-out infinite;
}
.orbit-sticker span {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 93%; height: 93%;
    clip-path: var(--burst);
    background: var(--sticker-face);
    animation: stickerWarm 3.2s ease-in-out infinite;
}
/* A gloss band crossing the face every few seconds, as if the light moved. The
   span's clip-path crops it to the starburst, so it never leaks past a spike. */
.orbit-sticker span::after {
    content: "";
    position: absolute;
    inset: -40%;
    background: linear-gradient(105deg, transparent 44%, rgba(255,255,255,0.6) 50%, transparent 56%);
    pointer-events: none;
    animation: stickerShine 4.6s 1.1s ease-in-out infinite;
}
.orbit-sticker:hover {
    scale: 1.07;
    filter: drop-shadow(4px 6px 0 rgba(0,0,0,0.65));
}
.orbit-sticker[hidden] { display: none; }
/* Lands like a sticker being pressed on, once, when the project comes forward.
   No forwards fill: holding `scale: 1` here would outrank the hover. */
@keyframes stickOn {
    from { opacity: 0; scale: 1.5; }
    to   { opacity: 1; scale: 1; }
}
/* Never quite settled - the tilt breathes a couple of degrees either side of
   where it landed, with a touch of float, so the thing looks pressed on by
   hand rather than printed into the layout. */
@keyframes stickerRock {
    0%, 100% { rotate: -13deg;   translate: 0 0; }
    35%      { rotate: -9.5deg;  translate: 0 -3px; }
    70%      { rotate: -16deg;   translate: 0 1px; }
}
@keyframes stickerWarm {
    0%, 100% { background: var(--sticker-face); }
    50%      { background: #fff04d; }
}
@keyframes stickerShine {
    0%, 62%   { transform: translateX(-115%); opacity: 0; }
    66%       { opacity: 1; }
    94%, 100% { transform: translateX(115%); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
    .orbit-sticker,
    .orbit-sticker span,
    .orbit-sticker span::after { animation: none; }
}

/* Pinned to the box, not under the model: centred beneath the stage it landed
   on top of the front node's label. */
.orbit-cad-tag {
    position: absolute;
    top: 14px; right: 14px;
    white-space: nowrap;
    font-size: 0.68rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.3;
    pointer-events: none;
}

/* The carousel of project nodes.

   No transform and no preserve-3d on the track: either one makes it a stacking
   context, and then its nodes can only paint as one block - every label in
   front of the model or every one behind it. They have to interleave with the
   model by z-index, which is the whole depth read. preserve-3d doing this
   silently is what put the centre veil over every label. */
.orbit-track {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
}
/* Narrower than they were: every px the labels give back is a px of radius the
   ring can use, and the radius is what opens the hole the model sits in. */
.orbit-node {
    position: absolute;
    width: 170px;
    margin-left: -85px;
    will-change: transform, opacity;
}
.orbit-node button {
    width: 100%;
    padding: 10px 9px;
    font-family: var(--font);
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    line-height: 1.4;
    color: var(--text);
    background: var(--bg);
    border: 2px solid var(--border);
    cursor: pointer;
    transition: color 0.3s, border-color 0.3s, box-shadow 0.3s, background 0.3s;
}
/* Depth sets node opacity inline, so hover lifts the button itself. */
.orbit-node button:hover { border-color: var(--accent); color: var(--accent); }
.orbit-node.front button {
    opacity: 1;
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 6px 0 rgba(0,0,0,0.6);
}
.orbit-dot {
    position: absolute;
    top: -18px; left: 50%;
    width: 7px; height: 7px;
    margin-left: -3.5px;
    border-radius: 50%;
    background: var(--text);
    opacity: 0.5;
}
.orbit-node.front .orbit-dot { background: var(--accent); opacity: 1; }

/* Bottom-right, not bottom-centre: the front node now lands in the middle of
   the lower edge and the two were sitting on top of each other. */
.orbit-ctrl {
    position: absolute;
    bottom: 14px; right: 14px;
    display: flex;
    gap: 8px;
    z-index: 200;
}
.orbit-ctrl button {
    width: 40px; height: 34px;
    font-family: var(--font);
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--accent);
    cursor: pointer;
}
.orbit-ctrl button:hover { background: var(--accent); color: var(--bg); }

.orbit-hint {
    position: absolute;
    left: 14px; bottom: 16px;
    font-size: 0.76rem;
    letter-spacing: 1.5px;
    opacity: 0.35;
    pointer-events: none;
}

@media (max-width: 820px) {
    .orbit-layout { grid-template-columns: 1fr; }
    #orbitBox { height: 420px; }
    /* The front node reaches the bottom-left corner on a narrow box, so the
       hint moves up out of its way. */
    .orbit-hint { top: 12px; bottom: auto; }
    /* Swaps with the hint so the two don't meet in the middle of a narrow box. */
    .orbit-cad-tag { top: auto; right: auto; bottom: 14px; left: 14px; }
    .orbit-node { width: 142px; margin-left: -71px; }
    .orbit-node button { font-size: 0.66rem; padding: 8px 6px; letter-spacing: 1px; }
}

/* On a phone five labels round the ring leave no middle worth putting a model
   in - every px they take comes off the radius twice over. So the ring carries
   bare markers and the name lives in the panel directly below, which was
   repeating it anyway. The button stays as a 36px touch target under the dot. */
@media (max-width: 560px) {
    /* Shorter than the desktop box: a shallow ring needs far less height than
       it does width, and the leftover was reading as a hole above the model. */
    #orbitBox { height: 390px; }
    .orbit-node { width: 36px; margin-left: -18px; }
    .orbit-node button {
        height: 36px;
        padding: 0;
        font-size: 0;
        border: 0;
        background: none;
    }
    .orbit-node button:hover { background: none; }
    .orbit-node.front button { background: none; box-shadow: none; }
    /* Same sticker against a much smaller model, so it has to come down or it
       stops being a sticker and starts being the subject. */
    .orbit-sticker { width: 74px; height: 74px; font-size: 0.48rem; letter-spacing: 0.5px; }
    .orbit-dot { width: 9px; height: 9px; margin-left: -4.5px; }
    .orbit-node.front .orbit-dot {
        width: 15px; height: 15px;
        margin-left: -7.5px;
        top: -22px;
    }
}

</style>
</head>
<body>
<div id="shootingStarsOverlay"></div>

<nav class="lab-bar">
    <span class="lab-tag">Projects</span>
    <button class="sfx-toggle" id="sfxToggle" type="button" title="Mute/Unmute sound"></button>
</nav>

<div class="lab-wrap">
    <!-- The page title is whichever project is at the front, so the model
         below it is always labelled. It replaces a fixed "Orbit" heading and
         a paragraph explaining the ring, which the ring explains by turning.
         aria-live, because for a screen reader this heading changing is the
         only announcement that the selection moved. -->
    <header class="lab-head">
        <h1 id="projectTitle" aria-live="polite">Hexapod Robot</h1>
    </header>

    <div class="orbit-layout">
        <div id="orbitBox">
            <div class="orbit-rings">
                <div class="orbit-ring"></div>
                <div class="orbit-ring"></div>
                <div class="orbit-ring"></div>
            </div>
            <div class="orbit-veil"></div>
            <div class="orbit-stage" id="stage">
                <div class="orbit-core"></div>
                <canvas id="cad"></canvas>
            </div>
            <a class="orbit-sticker" id="sticker" hidden><span>View<br>build<br>log</span></a>
            <span class="orbit-cad-tag">placeholder geometry</span>
            <div class="orbit-track" id="track"></div>
            <div class="orbit-ctrl">
                <button id="prev" type="button" aria-label="Previous">&#9664;</button>
                <button id="next" type="button" aria-label="Next">&#9654;</button>
            </div>
            <span class="orbit-hint">click a node · &#9664; &#9654; to rotate</span>
        </div>
        <aside class="detail" id="detail"></aside>
    </div>
</div>

<!-- The home page footer, less its music credit: the track and its mute
     toggle live on the home page only, so crediting it here would name
     something that never plays. Styled by the shared assets/css/style.css
     already loaded above. -->
<footer>
    <p>© 2026 Awan Abadullah</p>
    <br>
    <p>this site is maintained by <strong>Yawie</strong> <span style="color: var(--accent)">🤖</span> — an AI assistant running on OpenClaw (claude-opus-5 under the hood), living in a Mac Mini called <em>Banana HQ</em> in Montréal, Canada. <span style="color: var(--accent)">🍌❤️</span></p>
</footer>

<script src="stars.js?v=1"></script>
<script type="module" src="orbit.js?v=9"></script>
</body>
</html>

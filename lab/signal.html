<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ==================================================
   PROTOTYPE 3 — SIGNAL DECK
   Each project arrives as a streak, decodes with the
   hero's typewriter, and you swipe through the stack.
   ================================================== */
.deck-stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

#deck {
    position: relative;
    width: min(420px, 92vw);
    height: 560px;
    margin-bottom: 34px;   /* room for the cards peeking out behind */
    touch-action: none;          /* the drag is handled here, not by the browser */
    user-select: none;
}

.deck-card {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 2px solid var(--border);
    box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.75);
    transform-origin: 50% 130%;  /* pivot below the card, so drags arc */
    will-change: transform;
    overflow: hidden;
}
/* Only the top card takes input; the rest are scenery. */
.deck-card:not(.top) { pointer-events: none; }
.deck-card.settling { transition: transform 0.4s cubic-bezier(.2,.8,.3,1); }
.deck-card.flung    { transition: transform 0.45s ease-in, opacity 0.45s ease-in; opacity: 0; }

/* the streak that precedes a card reaching the top */
.card-streak {
    position: absolute;
    top: 18px; right: -10px;
    width: 220px; height: 2px;
    background: linear-gradient(-90deg, var(--accent), transparent);
    transform-origin: right center;
    transform: rotate(-35deg) scaleX(0);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
}
.deck-card.arriving .card-streak { animation: streak 0.6s ease-out forwards; }
@keyframes streak {
    0%   { transform: rotate(-35deg) scaleX(0); opacity: 0; }
    35%  { opacity: 1; }
    100% { transform: rotate(-35deg) scaleX(1); opacity: 0; }
}

/* the rotating model */
.card-cad {
    position: relative;
    height: 230px;
    flex: 0 0 auto;
    border-bottom: 2px solid var(--border);
}
.card-cad canvas { display: block; width: 100%; height: 100%; }
.card-cad .cad-tag {
    position: absolute;
    left: 12px; bottom: 8px;
    font-size: 0.55rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.28;
}

.card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px 18px 18px;
    min-height: 0;
}
.card-meta {
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.45;
}
.card-name {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    line-height: 1.4;
    min-height: 1.4em;
}
.card-name .cursor {
    background: var(--accent);
    color: var(--bg);
    animation: blink 1s step-end infinite;
}
.card-text { font-size: 0.84rem; line-height: 1.65; font-weight: 400; opacity: 0.85; flex: 1; }
.card-tags { list-style: none; display: flex; flex-wrap: wrap; gap: 5px; padding: 0; }
.card-tags li {
    font-size: 0.62rem;
    letter-spacing: 1px;
    padding: 2px 7px;
    border: 1px solid var(--accent);
    color: var(--accent);
}
.card-link {
    align-self: flex-start;
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    padding: 9px 16px;
    border: 2px solid var(--border);
    color: var(--accent);
}
.card-link:hover { background: var(--accent); color: var(--bg); }

/* direction cue while dragging */
.card-cue {
    position: absolute;
    top: 46%;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 8px 14px;
    border: 2px solid var(--accent);
    color: var(--accent);
    background: var(--bg);
    opacity: 0;
    pointer-events: none;
    z-index: 3;
}
.card-cue.left  { left: 16px; }
.card-cue.right { right: 16px; }

/* ---- controls ---- */
.deck-ctrl { display: flex; align-items: center; gap: 12px; }
.deck-ctrl button {
    font-family: var(--font);
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 1.5px;
    width: 52px; height: 42px;
    background: transparent;
    border: 2px solid var(--border);
    color: var(--accent);
    cursor: pointer;
}
.deck-ctrl button:hover { background: var(--accent); color: var(--bg); }
.deck-count { font-size: 0.78rem; letter-spacing: 2px; opacity: 0.6; min-width: 76px; text-align: center; }
.deck-hint { font-size: 0.68rem; letter-spacing: 1.5px; opacity: 0.4; text-align: center; }

@media (max-width: 600px) {
    #deck { height: 520px; }
    .card-cad { height: 190px; }
}
@media (prefers-reduced-motion: reduce) {
    .deck-card.arriving .card-streak { animation: none; }
}
</style>
</head>
<body>
<div id="shootingStarsOverlay"></div>

<nav class="lab-bar">
    <span class="lab-tag">Projects Lab</span>
    <a href="constellation.html">1 · Constellation</a>
    <a href="orbit.html">2 · Orbit</a>
    <a href="signal.html" aria-current="page">3 · Signal Deck</a>
</nav>

<div class="lab-wrap">
    <header class="lab-head">
        <h1>Signal Deck</h1>
        <p>Each project arrives as a streak and decodes into a card with its model turning. Fling the top card either way to bring in the next one.</p>
    </header>

    <div class="deck-stage">
        <div id="deck"></div>

        <div class="deck-ctrl">
            <button id="prev" type="button" aria-label="Previous project">&#9664;</button>
            <span class="deck-count" id="count">01 / 05</span>
            <button id="next" type="button" aria-label="Next project">&#9654;</button>
        </div>
        <p class="deck-hint">drag the card to fling it &middot; or use &#9664; &#9654;</p>
    </div>
</div>

<script src="stars.js"></script>
<script type="module" src="signal.js"></script>
</body>
</html>
